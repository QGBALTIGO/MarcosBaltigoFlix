name: Colinha quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: colinha-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Run unit/static tests
        run: pytest -q

      - name: Validate frontend JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/colinha.js

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps ${{ matrix.engine }}

      - name: Run Colinha browser matrix
        env:
          E2E_BROWSER: ${{ matrix.engine }}
        run: python tests/browser_colinha_e2e.py

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colinha-browser-screenshots-${{ matrix.engine }}
          path: artifacts/
          if-no-files-found: ignore

  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live-source smoke matrix
        env:
          ELECTION_MODE: simulation
          G1_DAILY_ENABLED: "false"
        run: python -m app.smoke --quick

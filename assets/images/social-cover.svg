      <stop offset=".52" stop-color="#101331"/>
      <stop offset="1" stop-color="#071F31"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(186 38) rotate(64) scale(430 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF" stop-opacity=".43"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1030 222) rotate(145) scale(430 400)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20D9FF" stop-opacity=".34"/>

    <text x="0" y="76" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="820" letter-spacing="-3.4">Sua tela. Seu tempo.</text>
    <text x="0" y="148" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="820" letter-spacing="-3.4">Seu entretenimento.</text>
    <text x="0" y="206" fill="#A9AEC7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Planos flexíveis e ativação orientada.</text>
